<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <!-- Meta tag crucial para tablets: evita el zoom y fija la escala -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Mirror Prototype</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./mainStyles.css">
</head>

<body>

    <!-- PANTALLA DE CARGA -->
    <section id="loadingScreen"
        class="d-flex flex-column justify-content-center align-items-center vh-100 vw-100 bg-dark text-white">
        <!-- Logo Genérico (usamos un ícono de Bootstrap temporalmente) -->
        <div class="mb-5 text-center fade-in-logo">
            <img src="https://i.pinimg.com/236x/9e/9f/7f/9e9f7ffe50d1d8ebf178acc9726d0735.jpg" alt="Logo de la Marca" class="mb-3" style="width: 80px; height: 80px;">
            <h2 class="fw-light letter-spacing-wide">NOMBRE DE LA MARCA</h2>
        </div>

        <!-- Barra de Progreso Elegante -->
        <div class="progress-container w-50">
            <div class="d-flex justify-content-between mb-2">
                <span id="loadingText" class="small text-uppercase tracking-wider text-white-50">Inicializando sistema...</span>
                <span id="loadingPercentage" class="small fw-bold">0%</span>
            </div>
            <div class="progress" style="height: 4px; background-color: #333;">
                <div id="loadingBar" class="progress-bar bg-white custom-glow" role="progressbar" style="width: 0%">
                </div>
            </div>
        </div>
    </section>

    <!-- PANTALLA PRINCIPAL (Oculta al inicio) -->
    <section id="mainApp" class="d-none vh-100 vw-100 bg-secondary">
        <div class="container h-100 d-flex justify-content-center align-items-center text-white">
            <h1>Pantalla de Selección de Prendas (Próximo paso)</h1>
        </div>
    </section>

    <!-- Tu script de lógica -->
    <script src="./appLogic.js"></script>
</body>

</html>
